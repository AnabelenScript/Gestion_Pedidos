services:
  orders-service:
    build: ./orders-service
    ports:
      - "3000:3000"
    environment:
      INVENTORY_URL: http://inventory-service:3001
      PAYMENTS_URL: http://payments-service:3002
      REDIS_HOST: redis
      DATABASE_URL: postgres://orders_user:orders_pass@orders-db:5432/orders_db
      JWT_SECRET: supersecret
    depends_on:
      - orders-db
      - redis
      - inventory-service
      - payments-service

  inventory-service:
    build: ./inventory-service
    ports:
      - "3001:3001"
    environment:
      REDIS_HOST: redis
      DATABASE_URL: postgres://inventory_user:inventory_pass@inventory-db:5432/inventory_db
    depends_on:
      - inventory-db
      - redis

  payments-service:
    build: ./payments-service
    ports:
      - "3002:3002"
    environment:
      DATABASE_URL: postgres://payments_user:payments_pass@payments-db:5432/payments_db
    depends_on:
      - payments-db

  orders-db:
    image: postgres:16
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: orders_user
      POSTGRES_PASSWORD: orders_pass
    ports:
      - "5433:5432"

  inventory-db:
    image: postgres:16
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: inventory_user
      POSTGRES_PASSWORD: inventory_pass
    ports:
      - "5434:5432"

  payments-db:
    image: postgres:16
    environment:
      POSTGRES_DB: payments_db
      POSTGRES_USER: payments_user
      POSTGRES_PASSWORD: payments_pass
    ports:
      - "5435:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"
